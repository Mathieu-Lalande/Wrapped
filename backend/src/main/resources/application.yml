spring:
  application:
    name: github-wrapped
  cache:
    type: caffeine
    cache-names: wrapped
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h

server:
  error:
    include-stacktrace: never
    include-message: never

wrapped:
  github:
    base-url: https://api.github.com
    # Lu depuis la variable d'environnement, jamais en dur.
    token: ${GITHUB_TOKEN:}
    connect-timeout: 5s
    read-timeout: 15s
  cors:
    allowed-origins: ${WRAPPED_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    max-requests: ${WRAPPED_RATE_LIMIT_MAX_REQUESTS:30}
    window: ${WRAPPED_RATE_LIMIT_WINDOW:1m}
